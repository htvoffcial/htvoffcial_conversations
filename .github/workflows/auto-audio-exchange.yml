name: Daily Gymnastics Brother TTS

on:
  schedule:
    # 日本時間 4:20 は UTC 19:20
    - cron: '20 19 * * *'
  workflow_dispatch:

jobs:
  generate-tts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Conversations Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install azure-cognitiveservices-speech

      - name: Generate Speech and Convert to HLS
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_VOICE: ja-JP-KeitaNeural
        run: |
          # 1. README.md からテキスト抽出
          curl -s https://raw.githubusercontent.com/htvoffcial/htvoffcial/main/README.md > readme.md
          TEXT=$(python3 -c "
          import re
          try:
              content = open('readme.md').read()
              pattern = r'<!-- DISCUSS_COACH_START -->(.*?)<!-- DISCUSS_COACH_END -->'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  text = match.group(1).strip()
                  # 不要な装飾を除去
                  text = re.sub(r'#+\s*', '', text)
                  text = text.replace('**', '')
                  print(text)
              else:
                  print('今日もお疲れ様！体操のお兄さんだよ。')
          except:
              print('今日もお疲れ様！')
          ")
          echo "Target Text: $TEXT"

          # 2. Azure Speech (正規) で MP3 を生成
          TTS_TEXT="$TEXT" TTS_OUT="latest.mp3" python3 scripts/ai-azure-tts.py

          # 3. ffmpeg で HLS (m3u8) に変換
          mkdir -p docs/stream
          ffmpeg -y -i latest.mp3 \
            -codec:a aac -b:a 128k \
            -f hls \
            -hls_time 10 \
            -hls_list_size 0 \
            -hls_segment_filename "docs/stream/data%03d.ts" \
            docs/stream/playlist.m3u8

          # 4. アーカイブ作成
          DIR="Archives/$(date +%Y-%m)"
          mkdir -p "$DIR"
          cp latest.mp3 "$DIR/$(date +%d).mp3"

          # 5. docs に README.md をコピーして保存
          cp readme.md docs/readme.md

      - name: Commit and Push
        run: |
          git config --global user.name "RAdi0Bot♪"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ latest.mp3 Archives/
          git commit -m "Update HLS stream, archives, and docs/readme.md $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push