name: Archive conversations.harutv.me (Internet Archive)

on:
  schedule:
    # JST 11:08 = UTC 02:08
    - cron: "8 2 * * *"
  workflow_dispatch:

jobs:
  savepagenow:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check today's marker; purge yesterday; decide whether to archive
        id: marker
        shell: bash
        run: |
          set -euo pipefail

          TODAY="$(date -u +%Y-%m-%d)"
          YESTERDAY="$(date -u -d '1 day ago' +%Y-%m-%d)"
          MARKER="archive-markers/${TODAY}.txt"
          YESTERDAY_MARKER="archive-markers/${YESTERDAY}.txt"

          echo "today=${TODAY}" >> "$GITHUB_OUTPUT"
          echo "marker=${MARKER}" >> "$GITHUB_OUTPUT"
          echo "yesterday_marker=${YESTERDAY_MARKER}" >> "$GITHUB_OUTPUT"

          if [ -f "$MARKER" ]; then
            echo "Today's marker exists (${MARKER}). No archive needed."
            echo "do_archive=false" >> "$GITHUB_OUTPUT"
          else
            echo "No today's marker (${MARKER}). Will archive."
            echo "do_archive=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "$YESTERDAY_MARKER" ]; then
            echo "Will delete yesterday marker: ${YESTERDAY_MARKER}"
            echo "delete_yesterday=true" >> "$GITHUB_OUTPUT"
          else
            echo "No yesterday marker to delete."
            echo "delete_yesterday=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save to Internet Archive (Save Page Now)
        if: steps.marker.outputs.do_archive == 'true'
        env:
          TARGET_URL: "https://conversations.harutv.me/"
        run: |
          set -euo pipefail
          curl -sS -L \
            -A "github-actions (htvoffcial_conversations scheduled archive)" \
            "https://web.archive.org/save/${TARGET_URL}" \
            -o response.txt
          head -n 200 response.txt || true

      - name: Update markers (create today's if archived; delete yesterday) + commit
        if: steps.marker.outputs.do_archive == 'true' || steps.marker.outputs.delete_yesterday == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TODAY="${{ steps.marker.outputs.today }}"
          MARKER="${{ steps.marker.outputs.marker }}"
          YESTERDAY_MARKER="${{ steps.marker.outputs.yesterday_marker }}"

          if [ "${{ steps.marker.outputs.do_archive }}" = "true" ]; then
            mkdir -p "$(dirname "$MARKER")"
            {
              echo "saved_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "target=https://conversations.harutv.me/"
              echo "run_id=${GITHUB_RUN_ID}"
            } > "$MARKER"
            git add "$MARKER"
          fi

          if [ "${{ steps.marker.outputs.delete_yesterday }}" = "true" ]; then
            git rm -f "$YESTERDAY_MARKER" || rm -f "$YESTERDAY_MARKER" || true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit only if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Archive marker ${TODAY}" || exit 0
          git push
