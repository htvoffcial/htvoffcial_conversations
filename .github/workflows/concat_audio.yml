name: Concat Monthly Audio

on:
  workflow_dispatch:
    inputs:
      target_month:
        description: '処理する月 (例: 2026-10)'
        required: true
        type: string

jobs:
  concat:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        # Artifactにアップロードするだけであれば fetch-depth 等は不要なので最小構成にします

      # --------------------------------------------------
      # 2. Install ffmpeg
      # --------------------------------------------------
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # --------------------------------------------------
      # 3. Concat target month audio
      # --------------------------------------------------
      - name: Concat audio files for ${{ inputs.target_month }}
        shell: bash
        run: |
          set -Eeuo pipefail

          shopt -s nullglob

          TARGET_MONTH="${{ inputs.target_month }}"
          ARCHIVES_DIR="Archives"
          OUTPUT_DIR="concat"
          month_dir="$ARCHIVES_DIR/$TARGET_MONTH"

          # 対象月のディレクトリが存在するかチェック
          if [[ ! -d "$month_dir" ]]; then
            echo "Error: Directory not found: $month_dir"
            exit 1
          fi

          mkdir -p "$OUTPUT_DIR"

          echo ""
          echo "========================================"
          echo "Processing: $month_dir"
          echo "========================================"

          # ------------------------------------------------
          # 入力ファイルを安全に取得
          # ------------------------------------------------
          mapfile -d '' input_files < <(
            find "$month_dir" -type f \
              \( -iname '*.mp3' -o -iname '*.opus' \) \
              -print0 | sort -z
          )

          if (( ${#input_files[@]} == 0 )); then
            echo "Error: No audio files found in $month_dir"
            exit 1
          fi

          echo "Found ${#input_files[@]} audio files."

          # ------------------------------------------------
          # 一時ディレクトリ
          # ------------------------------------------------
          tmp_dir="$(mktemp -d)"

          cleanup() {
            rm -rf "$tmp_dir"
          }

          trap cleanup EXIT

          wav_dir="$tmp_dir/wav"
          mkdir -p "$wav_dir"

          # ------------------------------------------------
          # すべて WAV に正規化
          # ------------------------------------------------
          echo ""
          echo "Normalizing audio files..."

          wav_index=0

          for input_file in "${input_files[@]}"; do
            wav_file="$wav_dir/$(printf '%06d.wav' "$wav_index")"

            echo "Input : $input_file -> Output: $wav_file"

            ffmpeg \
              -hide_banner \
              -loglevel warning \
              -y \
              -i "$input_file" \
              -vn \
              -ar 44100 \
              -ac 2 \
              -c:a pcm_s16le \
              "$wav_file"

            wav_index=$((wav_index + 1))
          done

          # ------------------------------------------------
          # concat 用リスト作成
          # ------------------------------------------------
          file_list="$tmp_dir/files.txt"

          : > "$file_list"

          for wav_file in "$wav_dir"/*.wav; do
            printf "file '%s'\n" "$wav_file" >> "$file_list"
          done

          # ------------------------------------------------
          # WAVを結合
          # ------------------------------------------------
          combined_wav="$tmp_dir/combined.wav"

          echo ""
          echo "Concatenating WAV files..."

          ffmpeg \
            -hide_banner \
            -loglevel warning \
            -y \
            -f concat \
            -safe 0 \
            -i "$file_list" \
            -c copy \
            "$combined_wav"

          # ------------------------------------------------
          # 最終MP3
          # ------------------------------------------------
          output_file="$OUTPUT_DIR/${TARGET_MONTH}月のお便りさん.mp3"

          echo ""
          echo "Creating MP3:"
          echo "$output_file"

          ffmpeg \
            -hide_banner \
            -loglevel warning \
            -y \
            -i "$combined_wav" \
            -vn \
            -ar 44100 \
            -ac 2 \
            -c:a libmp3lame \
            -b:a 192k \
            -write_xing 1 \
            -id3v2_version 3 \
            "$output_file"

          # ------------------------------------------------
          # 出力ファイルを検証
          # ------------------------------------------------
          echo ""
          echo "Validating:"
          echo "$output_file"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,duration \
            -show_entries format=size \
            -of default=noprint_wrappers=1 \
            "$output_file"

          echo ""
          echo "Finished: $TARGET_MONTH"

      # --------------------------------------------------
      # 4. Upload to Artifacts
      # --------------------------------------------------
      - name: Upload concatenated audio artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact名（GitHub上でダウンロードする際のzip名になります）
          name: Audio-${{ inputs.target_month }}
          # アップロードするファイルのパス
          path: concat/${{ inputs.target_month }}月のお便りさん.mp3
          # Artifactの保存期間（任意で調整してください。デフォルトは90日です）
          retention-days: 1
